{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2 class="mb-4">Cadastro</h2>
    <form method="post">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ profile_form.as_p }}
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <p class="mt-3">
        Já possui uma conta? <a href="{% url 'login' %}">Login</a>
    </p>
</div>
{% endblock %}
