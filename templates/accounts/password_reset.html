{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>Recuperar Senha</h2>
    <p>Digite seu e-mail para receber instruções de recuperação.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar e-mail</button>
    </form>
</div>
{% endblock %}
